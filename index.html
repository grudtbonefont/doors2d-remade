function drawPartyHud(){if(!NET.coop||!started||S.dead)return;let y=112;X.textAlign='left';X.font='12px Arial';let i=0;for(const o of NET.others.values()){i++;X.fillStyle='rgba(0,0,0,.55)';X.fillRect(10,y,240,20);X.fillStyle=o.gone?'#777':o.dead?'#c55':PCOL[i%4];X.fillText((o.gone?'(вышел) ':o.dead?'☠ ':'')+o.name+'  — дверь '+pad(o.room||0)+(o.dead?'':'  HP '+(o.hp??100)),16,y+14);y+=22}}

let ELEV=null;
function startElev(names,start,dur){const g=names.length>1?3:1.2;ELEV={t:0,g:g,dur:g+3.9,names:names.slice(0,4),start:start||0}}
function drawElev(){const E=ELEV,G=E.g,t=E.t,d=E.dur,cx=W/2,cy=H/2;X.save();X.globalAlpha=1;
 const closeE=Math.max(0,Math.min(1,(t-G)/0.8)),openE=Math.max(0,(t-(d-1))/0.9),dc=Math.max(0,closeE-openE);
 const ride=t>G+0.8&&t<d-1;let sx=0,sy=0;if(ride){const k=t<G+1.2||t>d-1.4?3.5:1.3;sx=(Math.random()-.5)*k*2;sy=(Math.random()-.5)*k*2}
 X.fillStyle='rgba(0,0,0,'+(openE>0?1-openE:1)+')';X.fillRect(0,0,W,H);X.globalAlpha=openE>0?1-openE*.9:1;X.translate(sx,sy);
 const bw=440,bh=300,bx=cx-bw/2,by=cy-bh/2+20;
 // shaft lines moving up
 X.strokeStyle='#2a2116';X.lineWidth=2;const off=ride?(t*260)%60:0;for(let y=-60;y<H+60;y+=60){X.beginPath();X.moveTo(bx-60,y-off);X.lineTo(bx-20,y-off);X.moveTo(bx+bw+20,y-off);X.lineTo(bx+bw+60,y-off);X.stroke()}
 // cabin
 const g=X.createLinearGradient(0,by,0,by+bh);g.addColorStop(0,'#4a3520');g.addColorStop(1,'#24180c');X.fillStyle=g;X.fillRect(bx,by,bw,bh);
 X.fillStyle='rgba(255,220,150,'+(0.12+0.05*Math.sin(t*20))+')';X.fillRect(bx,by,bw,bh);
 X.fillStyle='#ffe9b0';X.fillRect(cx-60,by+6,120,4);
 // people
 const n=E.names.length;E.names.forEach((nm,i)=>{const px=bx+bw*(i+1)/(n+1),py=by+bh-70;X.fillStyle='#000a';X.beginPath();X.ellipse(px,py+42,22,6,0,0,7);X.fill();X.fillStyle=['#d9b38c','#a8c6e0','#c9e0a8','#e0a8c6'][i];X.beginPath();X.arc(px,py,18,0,7);X.fill();X.fillStyle='#3a5a8a';X.fillRect(px-14,py+16,28,26);X.fillStyle='#fff';X.font='bold 14px sans-serif';X.textAlign='center';X.fillText(nm,px,py-28);
  if(n>1){const ready=t>0.3+i*(G-0.6)/Math.max(1,n-1);X.fillStyle=ready?'#7f7':'#aaa';X.font='12px sans-serif';X.fillText(ready?'✔ готов':'…',px,py+60)}});
 // doors
 const dw=bw/2*dc;X.fillStyle='rgba(138,143,150,.55)';X.fillRect(bx,by,dw,bh);X.fillRect(bx+bw-dw,by,dw,bh);X.fillStyle='#5b6066';if(dc>0.02){X.fillRect(bx+dw-3,by,3,bh);X.fillRect(bx+bw-dw,by,3,bh)}
 X.strokeStyle='#c9a45a';X.lineWidth=6;X.strokeRect(bx-3,by-3,bw+6,bh+6);
 // indicator
 const target=E.start,prog=Math.max(0,Math.min(1,(t-G-0.8)/(d-G-1.8))),fl=Math.round(Math.max(1,target)*prog);
 X.fillStyle='#120b05';X.fillRect(cx-70,by-62,140,44);X.strokeStyle='#c9a45a';X.lineWidth=2;X.strokeRect(cx-70,by-62,140,44);
 X.fillStyle='#ff5a2a';X.font='bold 26px monospace';X.textAlign='center';X.fillText((prog<1?'▼ ':'')+String(fl).padStart(3,'0'),cx,by-31);
 X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.fillStyle='#e8d6a8';X.font='16px sans-serif';X.textAlign='center';
 const left=Math.max(0,Math.ceil(d-1-t));X.fillText(t<G?(n>1?'Лифт собирается… отправление через '+Math.ceil(G-t):'Двери закрываются…'):t<d-1?'Спуск на этаж… '+left:'Двери открываются',cx,H-30);
 X.font='13px sans-serif';X.fillStyle='#b9a77f';X.fillText('Отель • старт с двери '+String(target).padStart(3,'0'),cx,H-12);X.restore()}

function toLobby(){ELEV=null;netSend({t:'leave'});NET.coop=false;NET.others=new Map();started=false;reset();showLobby(true)}
let NAME=localStorage.getItem('d2name')||'',LOBSTART=0;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderLobby(){const L=NET.lobby,pl=document.getElementById('lpl'),pa=document.getElementById('lpa'),me=document.getElementById('lme');if(!pl)return;
 pl.innerHTML=NET.ok?L.players.filter(p=>p.name).map(p=>'<li>'+esc(p.name)+(p.id===NET.id?' (ты)':'')+(p.party?' <i>в лифте #'+p.party+'</i>':'')+'</li>').join('')||'<li>никого</li>':'<li>нет связи с сервером</li>';
 const my=L.parties.find(q=>q.id===NET.party);const nm=id=>{const p=L.players.find(p=>p.id===id);return p?esc(p.name):'?'};
 pa.innerHTML=L.parties.filter(q=>q.id!==NET.party).map(q=>'<li>Лифт #'+q.id+' • '+q.members.map(nm).join(', ')+' • '+q.members.length+'/4 • старт '+q.start+(q.state==='wait'&&q.members.length<4?' <button data-j="'+q.id+'">Войти</button>':' <i>'+(q.state==='wait'?'полон':'в игре')+'</i>')+'</li>').join('')||'<li>пока нет лифтов</li>';
 if(my){const host=my.host===NET.id;me.innerHTML='<b>Твой лифт #'+my.id+'</b> ('+my.members.length+'/4): '+my.members.map(id=>nm(id)+(id===my.host?' ★':'')).join(', ')+'<br>Этаж: Отель • старт с двери '+my.start+'<br>'+(host?'<button id="lgo" class="big">Поехали!</button> ':'<i>Ждём, пока хост нажмёт «Поехали»...</i> ')+'<button id="llv">Выйти из лифта</button>'}else me.innerHTML='';
 pa.querySelectorAll('button[data-j]').forEach(b=>b.onclick=()=>{saveName();netSend({t:'join',party:+b.dataset.j})});
 const g=document.getElementById('lgo');if(g)g.onclick=()=>netSend({t:'start'});const lv=document.getElementById('llv');if(lv)lv.onclick=()=>netSend({t:'leave'});
 document.getElementById('lcr').disabled=!NET.ok;document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===LOBSTART))}
function saveName(){const v=document.getElementById('lnm').value.trim().slice(0,16)||'Игрок';NAME=v;localStorage.setItem('d2name',v);netSend({t:'hello',name:v})}
function initLobby(){const d=document.createElement('div');d.id='lob';d.innerHTML=`<div class="lb"><h1>DOORS 2D</h1><div class="sub">Фан-ремейк • Лобби</div>

 const st=document.createElement('style');st.textContent=`#lob{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#1a0f08,#000);z-index:10;color:#ddd;font:15px Arial;overflow:auto}

 const n=document.getElementById('lnm');n.value=NAME;n.onchange=saveName;n.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')saveName()});
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{LOBSTART=+b.dataset.s;netSend({t:'cfg',start:LOBSTART});renderLobby()});
 document.getElementById('lso').onclick=()=>{au();saveName();soloStart()};document.getElementById('lcr').onclick=()=>{au();saveName();netSend({t:'create',floor:'hotel',start:LOBSTART})};
 document.getElementById('lcd').onclick=()=>{au();showLobby(false);showCredits=true};d.addEventListener('pointerdown',()=>au());renderLobby();netConnect()}

requestAnimationFrame(loop);
