const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(3,'0');const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return Math.abs(d)};
// ---------- AUDIO ----------
let AC=null;function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='sine',v=.15,f2){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start();o.stop(t+d);}
function noise(d,v=.2,ff=800,type='lowpass'){if(!AC)return;const t=AC.currentTime,b=AC.createBuffer(1,Math.floor(AC.sampleRate*d),AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=ff;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(AC.destination);s.start();}
const SND={door:()=>{noise(.25,.3,300);tone(90,.2,'square',.05)},gold:()=>{tone(1200,.1,'triangle',.1);setTimeout(()=>tone(1600,.15,'triangle',.1),80)},pick:()=>tone(700,.12,'triangle',.12),
rush:()=>{noise(3.5,.5,400);tone(50,3,'sawtooth',.12,30)},ambush:()=>{noise(2.2,.5,1200,'bandpass');tone(200,2,'sawtooth',.1,900)},ambWarn:()=>tone(300,1,'sine',.04,500),
psst:()=>{noise(.15,.4,3000,'highpass');setTimeout(()=>noise(.2,.4,3000,'highpass'),220)},hurt:()=>tone(150,.3,'square',.15,60),halt:()=>tone(110,.8,'sine',.25,55),
flick:()=>noise(.08,.12,2000,'highpass'),step:r=>noise(.05,r?.12:.04,500),lock:()=>{tone(400,.08,'square',.08);setTimeout(()=>tone(300,.1,'square',.08),90)},
seek:()=>{tone(80,1.5,'sawtooth',.2,40);noise(1.5,.3,300)},figure:()=>tone(60,1.2,'sawtooth',.2,45),bad:()=>tone(200,.3,'square',.1,100),
holy:()=>{tone(880,.6,'sine',.12);tone(1320,.8,'sine',.08)},win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.4,'triangle',.15),i*180))},snare:()=>{tone(900,.05,'square',.2);noise(.2,.3,2000)}};
// ---------- DATA ----------
const ITEM={flashlight:{n:'Фонарик',c:'#ff8'},battery:{n:'Батарейка',c:'#6f6'},lockpick:{n:'Отмычка',c:'#bbb'},vitamins:{n:'Витамины',c:'#f80'},crucifix:{n:'Распятие',c:'#eee'},key:{n:'Ключ',c:'#fd4'}};
const SHOP=[['battery',40],['lockpick',60],['vitamins',50],['crucifix',150]];
const SOLID={dresser:1,wardrobe:1,bed:1,desk:1,shelf:1,counter:1,rubble:1,plant:1,breaker:1,crate:1};
const HINTS={rush:'Это был Раш. Когда свет мерцает — сразу прячься в шкаф или под кровать!',ambush:'Это был Эмбуш. Он без предупреждения и возвращается 2–4 раза. Выходи только когда всё стихнет.',
screech:'Скрич живёт в тёмных комнатах. Услышав «псст» — быстро повернись к нему (мышью/движением).',eyes:'Это были Глаза. Не смотри на них — отвернись и проходи мимо.',
halt:'Это был Халт. Когда видишь «РАЗВЕРНИСЬ!» — иди в обратную сторону.',dupe:'Это был Дюп. Смотри на номер двери: фальшивая дверь показывает неправильный номер.',
seek:'Сек догнал тебя. Бег (Shift) не останавливай, обходи завалы и огонь.',figure:'Фигура слепа, но слышит бег. Ходи медленно без Shift и прячься.',
snare:'В тёмной теплице капканы. Свети фонариком под ноги.',hide:'Хайд не любит, когда прячутся без причины. Выходи из шкафа вовремя.',fire:'Огонь во время погони опасен — обходи его.'};
const NAMES={rush:'Раш',ambush:'Эмбуш',screech:'Скрич'};
let tiles,rooms,objs,doors,solidObj,doorAt,occ,colRoom,GW,libCode;
const idx=(x,y)=>y*GW+x;
function nearDoor(r,x,y){for(const d of [r.west,r.east])if(d&&Math.abs(x-d.x)<=2&&Math.abs(y-d.y)<=1)return true;return false}
function passable(x,y){if(x<0||y<0||x>=GW||y>=GH)return false;const t=tiles[idx(x,y)];if(t===0)return false;if(t===2){const d=doorAt.get(idx(x,y));if(!d.open)return false}return !solidObj.has(idx(x,y))}
function bfs(r,sx,sy,tx,ty){const w=r.w,h=r.h,prev=new Int32Array(w*h).fill(-1),L=(x,y)=>(y-r.y0)*w+(x-r.x0);if(sx<=r.x0||sy<=r.y0||sx>=r.x0+w-1||sy>=r.y0+h-1)return null;const q=[[sx,sy]];prev[L(sx,sy)]=L(sx,sy);
 while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty){const p=[];let c=L(x,y);while(c!==L(sx,sy)){p.unshift([c%w+r.x0,Math.floor(c/w)+r.y0]);c=prev[c]}return p}
 for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<=r.x0||ny<=r.y0||nx>=r.x0+w-1||ny>=r.y0+h-1)continue;const l=L(nx,ny);if(prev[l]>=0||!passable(nx,ny))continue;prev[l]=L(x,y);q.push([nx,ny])}}return null}
function put(r,t,x,y,ex){const o=Object.assign({t,x,y,r:r.n},ex||{});objs.push(o);r.objs.push(o);occ.add(idx(x,y));if(SOLID[t])solidObj.set(idx(x,y),o);return o}
function gen(){
 rooms=[];objs=[];doors=[];doorAt=new Map();occ=new Set();
 const halts=new Set();while(halts.size<4){const n=ri(14,76);if((n<28||n>46)&&(n<48||n>54))halts.add(n)}
 let x=0;
 for(let n=0;n<=100;n++){let t='normal',w=ri(12,18),h=ri(8,12);
  if(n===0){t='reception';w=16;h=12}else if(n===50){t='library';w=30;h=22}else if(n===52){t='shop';w=14;h=10}else if(n===100){t='electric';w=30;h=20}
  else if(halts.has(n)){t='halt';w=40;h=5}else if((n>=36&&n<=41)||(n>=83&&n<=88)){t='chase';w=ri(18,24);h=9}else if(n>=90&&n<=98){t='greenhouse';w=ri(16,22);h=ri(11,14)}
  const r={n,x0:x,y0:Math.floor(GH/2-h/2),w,h,t,dark:t==='greenhouse'||(t==='normal'&&n>=8&&Math.random()<.22),eyesWall:(n>=30&&n<=35)||(n>=78&&n<=82),visited:false,objs:[],lamps:[]};
  rooms.push(r);x+=w-1}
 GW=x+2;tiles=new Uint8Array(GW*GH);solidObj=new Map();colRoom=new Int16Array(GW).fill(-1);
 for(const r of rooms){for(let yy=r.y0+1;yy<r.y0+r.h-1;yy++)for(let xx=r.x0+1;xx<r.x0+r.w-1;xx++)tiles[idx(xx,yy)]=1;for(let xx=r.x0;xx<r.x0+r.w;xx++)if(colRoom[xx]<0||xx>r.x0)colRoom[xx]=r.n}
 for(let n=1;n<=100;n++){const a=rooms[n-1],b=rooms[n];let lo=Math.max(a.y0,b.y0)+1,hi=Math.min(a.y0+a.h,b.y0+b.h)-2;if(hi-lo>=2){lo++;hi--}
  const d={n,x:b.x0,y:ri(lo,hi),open:false,locked:false,code:false,sealed:false};tiles[idx(d.x,d.y)]=2;doors.push(d);doorAt.set(idx(d.x,d.y),d);a.east=d;b.west=d}
 doors[0].locked=true;
 for(let n=2;n<=99;n++){const a=rooms[n-1],b=rooms[n];if(a.t==='normal'&&b.t==='normal'&&Math.random()<.2)doors[n-1].locked=true}
 doors[50].code=true;
 for(let n=37;n<=42;n++)doors[n-1].open=true;for(let n=84;n<=89;n++)doors[n-1].open=true;
 libCode='';for(let i=0;i<5;i++)libCode+=ri(0,9);
 for(const r of rooms){
  const ints=[],edges=[];
  for(let yy=r.y0+1;yy<r.y0+r.h-1;yy++)for(let xx=r.x0+1;xx<r.x0+r.w-1;xx++){if(nearDoor(r,xx,yy))continue;ints.push([xx,yy]);if(yy===r.y0+1||yy===r.y0+r.h-2)edges.push([xx,yy])}
  const take=a=>{for(let k=0;k<80;k++){const p=pick(a);if(p&&!occ.has(idx(p[0],p[1])))return p}return null};
  const lamps=k=>{if(r.dark)return;for(let i=0;i<k;i++)r.lamps.push({x:(r.x0+(i+.5)*(r.w/k))*T,y:(r.y0+1)*T+4})};
  const my=r.y0+Math.floor(r.h/2);
  if(r.t==='reception'){for(let i=0;i<3;i++)put(r,'desk',r.x0+7+i,my-1,{hasKey:i===1});for(let i=0;i<2;i++){const p=take(edges);if(p)put(r,'dresser',p[0],p[1])}lamps(3)}
  else if(r.t==='normal'||r.t==='greenhouse'){
   const nd=ri(1,3)+(r.t==='greenhouse'?0:1),keyD=r.east&&r.east.locked?ri(0,nd-1):-1;
   for(let i=0;i<nd;i++){const p=take(edges);if(p)put(r,'dresser',p[0],p[1],{key:i===keyD})}
   if(keyD>=0&&!r.objs.some(o=>o.key)){const p=take(ints);put(r,'dresser',p[0],p[1],{key:true})}
   const nw=ri(1,2);for(let i=0;i<nw;i++){const p=take(edges);if(p)put(r,'wardrobe',p[0],p[1])}
   if(Math.random()<.35){const p=take(edges);if(p)put(r,'bed',p[0],p[1])}
   if(r.t==='greenhouse'){for(let i=0;i<Math.floor(ints.length*.08);i++){const p=take(ints);if(p)put(r,'plant',p[0],p[1])}
    if(!bfs(r,r.x0+1,r.west.y,r.x0+r.w-2,r.east.y)){for(const o of r.objs.filter(o=>o.t==='plant'&&o.y!==r.y0+1&&o.y!==r.y0+r.h-2)){o.gone=true;solidObj.delete(idx(o.x,o.y))}}
    for(let i=0;i<ri(4,7);i++){const p=take(ints);if(p)put(r,'snare',p[0],p[1])}}
   if(r.t==='normal'&&r.n>=20&&r.east&&!r.east.locked&&r.n<99&&Math.random()<.12){r.dupe=true;const nb=rooms[r.n+1],lo=Math.max(r.y0,nb.y0)+1,hi=Math.min(r.y0+r.h,nb.y0+nb.h)-2;
    const used=[r.east.y];for(let k=0;k<2;k++){for(let tr=0;tr<20;tr++){const yy=ri(lo,hi);if(used.every(u=>Math.abs(u-yy)>=2)){used.push(yy);put(r,'fake',r.x0+r.w-1,yy,{num:r.n+1+pick([-1,1,2,3])});break}}}}
   lamps(2)}
  else if(r.t==='chase'){for(let c=r.x0+4,k=0;c<r.x0+r.w-4;c+=4,k++){const top=k%2===0;for(let j=0;j<4;j++){const yy=top?r.y0+1+j:r.y0+r.h-2-j;if(!nearDoor(r,c,yy))put(r,'rubble',c,yy)}}
   for(let i=0;i<3;i++){const p=take(ints);if(p)put(r,'fire',p[0],p[1])}lamps(3)}
  else if(r.t==='halt'){lamps(4)}
  else if(r.t==='library'){for(let yy=r.y0+3;yy<r.y0+r.h-3;yy+=3)for(let xx=r.x0+3;xx<r.x0+r.w-3;xx++){if((xx-r.x0)%7<2||nearDoor(r,xx,yy))continue;put(r,'shelf',xx,yy)}
   for(let i=0;i<4;i++){const p=take(ints);if(p)put(r,'desk',p[0],p[1],{hide:true})}
   for(let i=0;i<5;i++){const p=take(ints);put(r,'book',p[0],p[1],{i})}lamps(4)}
  else if(r.t==='shop'){for(let i=0;i<4;i++)put(r,'counter',r.x0+4+i,r.y0+3,{item:i});lamps(2)}
  else if(r.t==='electric'){for(let yy=r.y0+3;yy<r.y0+r.h-3;yy+=4)for(let xx=r.x0+4;xx<r.x0+r.w-4;xx+=5)if(!nearDoor(r,xx,yy)){put(r,'crate',xx,yy);put(r,'crate',xx+1,yy)}
   put(r,'breaker',r.x0+r.w-2,my);for(let i=0;i<3;i++){const p=take(edges);if(p)put(r,'wardrobe',p[0],p[1])}
   for(let i=0;i<10;i++){const p=take(ints);put(r,'fuse',p[0],p[1])}lamps(3)}
 }
}
// ---------- STATE ----------
let P,S,K={},mouse={x:0,y:0,t:-9},started=false,frames=0;
function reset(){gen();const r=rooms[0];
 P={x:(r.x0+3)*T+16,y:(r.y0+Math.floor(r.h/2))*T+16,hp:100,gold:0,face:0,inv:['flashlight'],sel:0,bat:100,light:false,hidden:null,hideT:0,stun:0,vit:0,room:0,best:0,noise:0,roomT:0,hurtT:0,fireCd:0};
 S={t:0,ents:[],msg:'',msgT:0,flick:0,dead:null,win:false,codeInput:null,shop:false,books:[],seek:null,trail:[],trailT:0,halt:null,sign:0,fuses:0,figure:null,screech:null,eyes:null,shake:0};
 msg('Ресепшен. Ключ от двери 001 лежит на стойке.',5)}
function msg(t,d=3){S.msg=t;S.msgT=d}
function damage(a,c){if(S.dead||S.win)return;P.hp-=a;P.hurtT=.3;S.shake=.3;SND.hurt();if(P.hp<=0){P.hp=0;S.dead=c}}
function die(c){if(!S.dead){P.hp=0;S.dead=c;SND.hurt();S.shake=.5}}
function addItem(it){if(P.inv.length>=5){msg('Инвентарь полон');return false}P.inv.push(it);return true}
const held=n=>P.inv[P.sel]===n;
function removeItem(n){const i=P.inv.indexOf(n);if(i>=0){P.inv.splice(i,1);if(P.sel>=P.inv.length)P.sel=Math.max(0,P.inv.length-1)}}
function useCrucifix(name){removeItem('crucifix');SND.holy();msg('Распятие изгнало: '+name+'!',3)}
// ---------- INPUT ----------
addEventListener('keydown',e=>{au();K[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(!started){started=true;return}
 if(S.dead||S.win){if(e.code==='KeyR'||e.code==='Enter')reset();return}
 if(S.codeInput!==null){if(/^Digit\d$/.test(e.code)&&S.codeInput.length<5)S.codeInput+=e.code[5];else if(e.code==='Backspace')S.codeInput=S.codeInput.slice(0,-1);else if(e.code==='Escape')S.codeInput=null;
  else if(e.code==='Enter'){if(S.codeInput===libCode){doors[50].code=false;doors[50].open=true;SND.door();msg('Замок открыт!');S.figure=null}else{SND.bad();msg('Неверный код! Фигура услышала...');if(S.figure){S.figure.target={x:P.x,y:P.y};S.figure.alert=true;S.figure.pt=0}}S.codeInput=null}return}
 if(S.shop){const m=/^Digit([1-4])$/.exec(e.code);if(m){const [it,pr]=SHOP[+m[1]-1];if(P.gold<pr){SND.bad();msg('Недостаточно золота')}else if(addItem(it)){P.gold-=pr;SND.gold();msg('Куплено: '+ITEM[it].n)}}else if(e.code==='Escape'||e.code==='KeyE')S.shop=false;return}
 if(e.code==='KeyE')interact();
 if(e.code==='KeyF'){if(P.inv.includes('flashlight')){if(P.bat>0){P.light=!P.light;tone(1500,.03,'square',.05)}else msg('Батарейка села')}else msg('Нет фонарика')}
 const m=/^Digit([1-5])$/.exec(e.code);if(m){const i=+m[1]-1;if(i<P.inv.length){P.sel=i;const it=P.inv[i];
  if(it==='battery'){P.bat=100;removeItem('battery');SND.pick();msg('Фонарик заряжен')}else if(it==='vitamins'){P.vit=7;P.hp=Math.min(100,P.hp+15);removeItem('vitamins');SND.pick();msg('Витамины: скорость!')}else if(it==='flashlight'){if(P.bat>0)P.light=!P.light}}}
});
addEventListener('keyup',e=>{K[e.code]=false});
C.addEventListener('mousemove',e=>{const b=C.getBoundingClientRect();mouse.x=(e.clientX-b.left)*W/b.width;mouse.y=(e.clientY-b.top)*H/b.height;mouse.t=performance.now()/1000});
C.addEventListener('mousedown',()=>{au();if(!started)started=true;else if(S.dead||S.win)reset()});
// ---------- INTERACT ----------
function nearObj(){let best=null,bd=46;for(const o of rooms[P.room].objs){if(o.gone)continue;const ok={dresser:!o.used,wardrobe:1,bed:1,desk:o.hasKey||o.hide,book:1,fuse:1,breaker:1,counter:1}[o.t];if(!ok)continue;
 const d=Math.hypot(o.x*T+16-P.x,o.y*T+16-P.y);if(d<bd){bd=d;best=o}}return best}
function nearLockedDoor(){for(const d of [doors[P.room-1],doors[P.room]]){if(d&&!d.open&&(d.locked||d.code)&&Math.hypot(d.x*T+16-P.x,d.y*T+16-P.y)<50)return d}return null}
function interact(){
 if(P.hidden){P.hidden=null;P.hideT=0;SND.door();return}
 const o=nearObj();
 if(o){switch(o.t){
  case 'dresser':o.used=true;tone(250,.15,'triangle',.08);if(o.key){addItem('key');SND.pick();msg('Найден ключ!')}else{const R=Math.random();
   if(R<.45){const g=ri(5,30);P.gold+=g;SND.gold();msg('+'+g+' золота')}else if(R<.68){const it=Math.random()<.12?'crucifix':pick(['battery','lockpick','vitamins','battery']);if(addItem(it)){SND.pick();msg('Найдено: '+ITEM[it].n)}}else msg('Пусто...')}break;
  case 'wardrobe':case 'bed':P.hidden=o;P.hideT=0;SND.door();break;
  case 'desk':if(o.hasKey){if(addItem('key')){o.hasKey=false;SND.pick();msg('Ключ взят! Открой дверь 001 (E)')}}else{P.hidden=o;P.hideT=0;tone(200,.1)}break;
  case 'book':o.gone=true;S.books[o.i]=libCode[o.i];SND.pick();msg('Книга: '+(o.i+1)+'-я цифра кода = '+libCode[o.i],4);break;
  case 'fuse':o.gone=true;S.fuses++;SND.pick();msg('Предохранитель '+S.fuses+'/10');break;
  case 'breaker':if(S.fuses>=10){S.win=true;SND.win()}else{SND.bad();msg('Нужно 10 предохранителей ('+S.fuses+'/10)')}break;
  case 'counter':S.shop=true;break}return}
 const d=nearLockedDoor();
 if(d){if(d.code){S.codeInput='';return}
  if(P.inv.includes('key')){removeItem('key');d.locked=false;SND.lock();msg('Дверь отперта ключом')}else if(P.inv.includes('lockpick')){removeItem('lockpick');d.locked=false;SND.lock();msg('Дверь вскрыта отмычкой')}else{SND.bad();msg('Заперто. Найди ключ в ящиках этой комнаты.')}}
}
// ---------- ENTITIES ----------
function startRush(amb){const n=P.room,a=rooms[Math.max(0,n-3)],b=rooms[Math.min(100,n+2)];
 S.ents.push({type:amb?'ambush':'rush',x0:a.x0*T,x1:(b.x0+b.w)*T,x:a.x0*T,dir:1,y:P.y,state:'wait',t:amb?1.3:3.3,reb:amb?ri(2,4):0,sp:amb?1100:800});

function mkFigure(r){let x=r.x0+Math.floor(r.w/2),y=r.y0+Math.floor(r.h/2);for(let k=0;k<200&&!passable(x,y);k++){x=ri(r.x0+1,r.x0+r.w-2);y=ri(r.y0+1,r.y0+r.h-2)}SND.figure();return{x:x*T+16,y:y*T+16,room:r.n,path:[],pt:1,target:null,alert:false,wait:2.5}}
